# DataHub と同時起動したいときだけ重ねる 3 枚目の override．
# 既定では使わない．scripts/lib.sh の om_compose_files() が
# OM_ALT_PORTS=1 のときだけこのファイルを -f で追加する．
#   例: OM_ALT_PORTS=1 ./openmetadata/scripts/up.sh
#
# ずらす対象は DataHub と衝突する 3 サービスのみ．
# openmetadata-server の 8585 / 8586 は DataHub（UI 9002）と衝突しないため
# ここでは触らない．そのため UI の URL は常に http://localhost:8585 のまま．
#
# !override を使う理由は compose.override.yml と同じ（ports は追記マージされる
# ため，明示的に置き換える必要がある）．変数展開の不具合も同様のため，
# ここもリテラル値を直接書く．

services:
  mysql:
    ports: !override
      - "13306:3306"

  elasticsearch:
    ports: !override
      - "19200:9200"
      - "19300:9300"

  ingestion:
    ports: !override
      - "18080:8080"
